<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="945" viewBox="0 0 1200 945"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#303030"/></marker></defs><rect width="1200" height="945" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#111111"><text x="600" y="40" text-anchor="middle" font-size="32"><tspan x="600" dy="0">在线验证驱动的执行决策闭环</tspan></text><rect x="70" y="80" width="1060" height="86" rx="4" fill="#f6f6f6" stroke="#666" stroke-width="2"/><text x="600" y="131.96" text-anchor="middle" font-size="28"><tspan x="600" dy="0">同一后端与 episode：RGB-D 新帧、标定、关节与执行反馈</tspan></text><line x1="600" y1="166" x2="600" y2="201" stroke="#303030" stroke-width="2.6"  marker-end="url(#arrow)"/><rect x="230" y="207" width="740" height="90" rx="4" fill="#f6f6f6" stroke="#666" stroke-width="2"/><text x="600" y="241.96" text-anchor="middle" font-size="28"><tspan x="600" dy="0">VLM 像素理解 + 原始深度几何解算</tspan><tspan x="600" dy="38">校准风险、动作时效、任务与版本状态</tspan></text><line x1="400" y1="297" x2="230" y2="344" stroke="#303030" stroke-width="2.6"  marker-end="url(#arrow)"/><line x1="800" y1="297" x2="890" y2="344" stroke="#303030" stroke-width="2.6"  marker-end="url(#arrow)"/><rect x="50" y="350" width="475" height="126" rx="4" fill="#f6f6f6" stroke="#666" stroke-width="2"/><text x="287.5" y="383.96" text-anchor="middle" font-size="28"><tspan x="287.5" dy="0">C1 有限候选决策</tspan><tspan x="287.5" dy="38">继续 / 重观测 / 本地恢复</tspan><tspan x="287.5" dy="38">云端求助 / 停止</tspan></text><rect x="675" y="350" width="475" height="126" rx="4" fill="#f6f6f6" stroke="#666" stroke-width="2"/><text x="912.5" y="383.96" text-anchor="middle" font-size="28"><tspan x="912.5" dy="0">云端慢规划与复杂重规划</tspan><tspan x="912.5" dy="38">返回受约束候选</tspan><tspan x="912.5" dy="38">边缘保留最终拒绝权</tspan></text><line x1="530" y1="398" x2="669" y2="398" stroke="#303030" stroke-width="2.6"  marker-end="url(#arrow)"/><line x1="670" y1="443" x2="533" y