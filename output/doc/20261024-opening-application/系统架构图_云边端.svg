<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1510" viewBox="0 0 1400 1510"><title>小型机械臂云边协同控制系统架构</title><desc>云端Qwen3.8-Max承担任务规划、监督和重规划；边缘侧维护状态、检查条件并以事件与成本进行协同决策；端侧通过顶视RGB-D相机、可见姿态标记和OpenCV获取证据，经过SafetyShield交由技能执行器和控制器完成动作，新观测及反馈返回边缘侧形成闭环。云端请求异步，边缘模型选型后置。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#333"/></marker></defs><rect width="1400" height="1510" fill="white"/><g fill="#111" font-family="Noto Sans CJK SC, sans-serif"><text x="700" y="45" text-anchor="middle" font-size="38" font-weight="600">小型机械臂云边协同控制系统架构</text><rect x="490" y="77" width="420" height="64" rx="5" fill="#fff" stroke="#333" stroke-width="2"/><text x="700" y="120" text-anchor="middle" font-size="32" font-weight="600">任务指令</text><polyline points="700,141 700,180" fill="none" stroke="#333" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="40" y="180" width="1320" height="220" rx="5" fill="#f7f8f9" stroke="#333" stroke-width="2"/><text x="75" y="226" text-anchor="start" font-size="33" font-weight="600">云端  Qwen3.8-Max</text><rect x="90" y="260" width="340" height="110" rx="5" fill="#fff" stroke="#333" stroke-width="2"/><text x="260" y="299" text-anchor="middle" font-size="31" font-weight="600">任务与场景理解</text><text x="260" y="338" text-anchor="middle" font-size="28" font-weight="400">目标与任务语义</text><rect x="530" y="260" width="340" height="110" rx="5" fill="#fff" stroke="#333" stroke-width="2"/><text x="700" y="299" text-anchor="middle" font-size="31" font-weight="600">任务规划与监督</text><text x="700" y="338" text-anchor="middle" font-size="28" font-weight="400">步骤与执行条件</text><rect x="970" y="260" width="340" height="110" rx="5" fill="#fff" stroke="#333" stroke-width="2"/><text x="1140" y="299" text-anchor="middle" font-size="31" font-weight="600">异常分析与重规划</text><text x="1140" y="338" text-anchor="middle" font-size="28" font-weight="400">更新受影响的方案</text><polyline points="430,315 520,315" fill="none" stroke="#333" stroke-width="2.8" marker-end="url(#arrow)"/><polyline points="970,315 880,315" fill="none" stroke="#333" stroke-width="2.8" marker-end="url(#arrow)"/><polyline points="390,400 390,535" fill="none" stroke="#333" stroke-width="2.8" marker-end="url(#arrow)"/><text x="418" y="460" text-anchor="start" font-size="28" font-weight="400">结构化步骤 / 条件</text><polyline points="1000,540 1000,405" fill="none" stroke="#333" stroke-width="2.8" marker-end="url(#arrow)"/><text x="1028" y="455" text-anchor="start" font-size="28" font-weight="400">异步云端请求</text><text x="1028" y="492" text-anchor="start" font-size="28" font-weight="400">任务状态与场景</text><rect x="40" y="540" width="1320" height="350" rx="5" fill="#f7f8f9" stroke="#333" stroke-width="2"/><text x="75" y="586" text-anchor="start" font-size="33" font-weight="600">边缘侧  状态管理与协同决策</text><text x="1325" y="624" text-anchor="end" font-size="25" font-weight="400">规则与成本判断；边缘模型后续选型</text><rect x="90" y="655" width="340" height="134" rx="5" fill="#fff" stroke="#333" stroke-width="2"/><text x="260" y="694" text-anchor="middle" font-size="31" font-weight="600">任务状态管理</text><text x="260" y="733" text-anchor="middle" font-size="28" font-weight="400">观测与动作反馈</text><text x="260" y="767" text-anchor="middle" font-size="28" font-weight="400">步骤及版本信息</text><rect x="530" y="655" width="340" height="134" rx="5" fill="#fff" stroke="#333" stroke-width="2"/><text x="700" y="694" text-anchor="middle" font-size="31" font-weight="600">执行条件检查</text><text x="700" y="733" text-anchor="middle" font-size="28" font-weight="400">身份 / 时效 / 几何</text><text x="700" y="767" text-anchor="middle" font-size="28" font-weight="400">候选能力与风险约束</text><rect x="970" y="655" width="340" height="134" rx="5" fill="#fff" stroke="#333" stroke-width="2"/><text x="1140" y="694" text-anchor="middle" font-size="31" font-weight="600">事件触发与选择</text><text x="1140" y="733" text-anchor="middle" font-size="28" font-weight="400">风险 / 时间 / 通信成本</text><text x="1140" y="767" text-anchor="middle" font-size="28" font-weight="400">局部修复与请求调度</text><polyline points="430,721 520,721" fill="none" stroke="#333" stroke-width="2.8" marker-end="url(#arrow)"/><polyline points="870,721 960,721" fill="none" stroke="#333" stroke-width="2.8" marker-end="url(#arrow)"/><text x="700" y="852" text-anchor="middle" font-size="28" font-weight="500">继续执行    重新观测    局部修复    请求云端    停止</text><polyline points="310,1000 310,895" fill="none" stroke="#333" stroke-width="2.8" marker-end="url(#arrow)"/><text x="335" y="957" text-anchor="start" font-size="28" font-weight="400">新观测 / 效果反馈</text><polyline points="1050,890 1050,995" fill="none" stroke="#333" stroke-width="2.8" marker-end="url(#arrow)"/><text x="1078" y="937" text-anchor="start" font-size="28" font-weight="400">技能指令</text><text x="1078" y="975" text-anchor="start" font-size="28" font-weight="400">重观测 / 停止</text><rect x="40" y="1000" width="1320" height="420" rx="5" fill="#f7f8f9" stroke="#333" stroke-width="2"/><text x="75" y="1046" text-anchor="start" font-size="33" font-weight="600">端侧  视觉感知与动作执行</text><rect x="90" y="1085" width="520" height="98" rx="5" fill="#fff" stroke="#333" stroke-width="2"/><text x="350" y="1124" text-anchor="middle" font-size="31" font-weight="600">顶视 RGB-D 相机</text><text x="350" y="1163" text-anchor="middle" font-size="28" font-weight="400">可见姿态标记与场景图像</text><rect x="790" y="1085" width="520" height="98" rx="5" fill="#fff" stroke="#333" stroke-width="2"/><text x="1050" y="1124" text-anchor="middle" font-size="31" font-weight="600">动作约束检查与独立停止</text><text x="1050" y="1163" text-anchor="middle" font-size="28" font-weight="400">SafetyShield</text><rect x="90" y="1230" width="520" height="100" rx="5" fill="#fff" stroke="#333" stroke-width="2"/><text x="350" y="1269" text-anchor="middle" font-size="31" font-weight="600">OpenCV 与 RGB-D 几何</text><text x="350" y="1308" text-anchor="middle" font-size="28" font-weight="400">身份 / 几何 / 时序 / 效果证据</text><rect x="790" y="1230" width="520" height="100" rx="5" fill="#fff" stroke="#333" stroke-width="2"/><text x="1050" y="1269" text-anchor="middle" font-size="31" font-weight="600">技能执行与现有控制器</text><text x="1050" y="1308" text-anchor="middle" font-size="28" font-weight="400">抓取 / 搬运 / 放置</text><polyline points="350,1183 350,1225" fill="none" stroke="#333" stroke-width="2.8" marker-end="url(#arrow)"/><polyline points="1050,1183 1050,1225" fill="none" stroke="#333" stroke-width="2.8" marker-end="url(#arrow)"/><polyline points="1050,1330 1050,1360 350,1360 350,1335" fill="none" stroke="#333" stroke-width="2.8" marker-end="url(#arrow)"/><text x="700" y="1400" text-anchor="middle" font-size="27" font-weight="400">新图像 / 本体反馈 / 执行结果</text><text x="700" y="1470" text-anchor="middle" font-size="27" font-weight="400">验证环境：MuJoCo 物理仿真；真实设备实验按设备条件安排</text></g></svg>