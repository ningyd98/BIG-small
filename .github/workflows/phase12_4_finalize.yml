name: Phase 12.4 finalize

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase12_4_finalize.yml
      - scripts/apply_phase12_4_remediation.py

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sim-mujoco]"

      - name: Apply audited remediation
        run: python scripts/apply_phase12_4_remediation.py

      - name: Add Chinese module responsibility descriptions
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/cloud_edge_robot_arm/dashboard/security.py"): (
                  '"""Dashboard transport authentication and server-side role authorization."""',
                  '"""Dashboard 传输鉴权与服务端角色授权，禁止客户端自行声明网络权限。"""',
              ),
              Path("tests/test_phase12_4_security_remediation.py"): (
                  '"""Phase 12.4 regressions for trusted time and console authorization."""',
                  '"""Phase 12.4 安全回归测试，覆盖可信时钟与控制台服务端授权。"""',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"module docstring patch mismatch: {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format patched files
        run: |
          python -m ruff check --fix \
            src/cloud_edge_robot_arm/edge/runtime/task_executor.py \
            src/cloud_edge_robot_arm/dashboard/security.py \
            src/cloud_edge_robot_arm/cloud/api/model_control.py \
            tests/test_phase12_4_security_remediation.py \
            tests/test_phase10_2b_dashboard_backend.py
          python -m ruff format \
            src/cloud_edge_robot_arm/edge/runtime/task_executor.py \
            src/cloud_edge_robot_arm/dashboard/security.py \
            src/cloud_edge_robot_arm/cloud/api/model_control.py \
            tests/test_phase12_4_security_remediation.py \
            tests/test_phase10_2b_dashboard_backend.py

      - name: Run remediation regressions
        run: |
          python -m pytest -q \
            tests/test_phase12_4_security_remediation.py \
            tests/test_phase2_task_runtime.py \
            tests/test_phase10_2b_dashboard_backend.py \
            tests/test_phase11_simulation_workbench_backend.py \
            tests/test_phase11_2_model_control_backend.py

      - name: Hide temporary remediation machinery from final gates
        run: |
          rm -f \
            .github/workflows/phase12_4_remediation.yml \
            .github/workflows/phase12_4_pr_remediation.yml \
            .github/workflows/phase12_4_finalize.yml \
            scripts/apply_phase12_4_remediation.py

      - name: Compile check
        run: python -m compileall src scripts tests

      - name: Format check
        run: python -m ruff format --check .

      - name: Lint check
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy .

      - name: Documentation consistency
        run: python scripts/check_docs.py

      - name: Chinese responsibility descriptions
        run: python scripts/check_chinese_comments.py

      - name: Secret safety check
        run: python scripts/check_model_control_secrets.py

      - name: Commit verified source remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/cloud_edge_robot_arm/edge/runtime/task_executor.py \
            src/cloud_edge_robot_arm/dashboard/security.py \
            src/cloud_edge_robot_arm/cloud/api/model_control.py \
            tests/test_phase12_4_security_remediation.py \
            tests/test_phase10_2b_dashboard_backend.py
          git commit -m "fix: harden trusted time and console authorization"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
