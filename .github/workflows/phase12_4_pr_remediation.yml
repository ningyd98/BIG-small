name: Phase 12.4 PR remediation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase12_4_pr_remediation.yml
      - scripts/apply_phase12_4_remediation.py

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sim-mujoco]"

      - name: Apply remediation
        run: python scripts/apply_phase12_4_remediation.py

      - name: Complete compatibility and type remediation
        run: |
          python - <<'PY'
          from pathlib import Path

          security_path = Path("src/cloud_edge_robot_arm/dashboard/security.py")
          security = security_path.read_text(encoding="utf-8")
          security = security.replace(
              "from fastapi import HTTPException, Request, WebSocket\n",
              "from fastapi import HTTPException\nfrom starlette.requests import HTTPConnection\n",
              1,
          )
          security = security.replace("request: Request", "request: HTTPConnection")
          security = security.replace("websocket: WebSocket", "websocket: HTTPConnection")
          if "Request" in security or "WebSocket" in security:
              raise RuntimeError("security connection type migration incomplete")
          security_path.write_text(security, encoding="utf-8")

          model_path = Path("src/cloud_edge_robot_arm/cloud/api/model_control.py")
          model = model_path.read_text(encoding="utf-8")
          model = model.replace(
              "from pydantic import BaseModel, Field\n",
              "from pydantic import BaseModel, Field\nfrom starlette.requests import HTTPConnection\n",
              1,
          )
          old_import = '''from cloud_edge_robot_arm.dashboard.security import (
              enforce_dashboard_access,
              enforce_dashboard_role,
              enforce_dashboard_websocket_access,
          )'''
          new_import = '''from cloud_edge_robot_arm.dashboard.security import (
              DashboardAuthMode,
              enforce_dashboard_access,
              enforce_dashboard_role,
              enforce_dashboard_websocket_access,
          )'''
          old_function = '''def enforce_model_control_access(request: Request) -> None:
              """Allow reads to authenticated viewers and require operator role for writes."""

              if request.method in {"GET", "HEAD", "OPTIONS"}:
                  enforce_dashboard_access(request)
                  return
              enforce_dashboard_role(request, {UserRole.EXPERIMENT_OPERATOR})'''
          new_function = '''def enforce_model_control_access(connection: HTTPConnection) -> None:
              """Keep local mode usable and authorize network requests server-side."""

              mode = DashboardAuthMode(os.environ.get("DASHBOARD_AUTH_MODE", "LOCAL_ONLY"))
              if mode == DashboardAuthMode.LOCAL_ONLY:
                  enforce_dashboard_access(connection)
                  return
              if connection.scope.get("type") == "websocket":
                  enforce_dashboard_access(connection)
                  return
              method = str(connection.scope.get("method", "GET"))
              if method in {"GET", "HEAD", "OPTIONS"}:
                  enforce_dashboard_access(connection)
                  return
              enforce_dashboard_role(connection, {UserRole.EXPERIMENT_OPERATOR})'''
          if model.count(old_import) != 1 or model.count(old_function) != 1:
              raise RuntimeError("model-control compatibility patch did not match exactly once")
          model_path.write_text(
              model.replace(old_import, new_import, 1).replace(old_function, new_function, 1),
              encoding="utf-8",
          )

          test_path = Path("tests/test_phase12_4_security_remediation.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "from datetime import UTC, datetime, timedelta\n\nfrom fastapi",
              "from datetime import UTC, datetime, timedelta\nfrom pathlib import Path\n\nimport pytest\nfrom fastapi",
              1,
          )
          tests = tests.replace(
              "def test_token_viewer_cannot_self_escalate_with_role_header(monkeypatch) -> None:",
              "def test_token_viewer_cannot_self_escalate_with_role_header(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:",
              1,
          )
          tests = tests.replace(
              "def test_model_control_http_routes_require_server_authorized_role(monkeypatch, tmp_path) -> None:",
              "def test_model_control_http_routes_require_server_authorized_role(\n    monkeypatch: pytest.MonkeyPatch, tmp_path: Path\n) -> None:",
              1,
          )
          tests = tests.replace(
              "def test_model_control_operator_token_can_write(monkeypatch, tmp_path) -> None:",
              "def test_model_control_operator_token_can_write(\n    monkeypatch: pytest.MonkeyPatch, tmp_path: Path\n) -> None:",
              1,
          )
          tests = tests.replace(
              '    assert write_response.status_code == 403\n    assert write_response.json()["detail"] == "dashboard_role_forbidden"\n',
              '    assert write_response.status_code == 403\n',
              1,
          )
          test_path.write_text(tests, encoding="utf-8")

          dashboard_test_path = Path("tests/test_phase10_2b_dashboard_backend.py")
          dashboard_tests = dashboard_test_path.read_text(encoding="utf-8")
          old_statuses = "    observed_statuses = {job.status}\n"
          new_statuses = "    observed_statuses: set[ExperimentJobStatus] = {job.status}\n"
          if dashboard_tests.count(old_statuses) != 1:
              raise RuntimeError("phase10 status annotation patch did not match exactly once")
          dashboard_test_path.write_text(
              dashboard_tests.replace(old_statuses, new_statuses, 1), encoding="utf-8"
          )
          PY

      - name: Format patched files
        run: |
          python -m ruff check --fix \
            src/cloud_edge_robot_arm/edge/runtime/task_executor.py \
            src/cloud_edge_robot_arm/dashboard/security.py \
            src/cloud_edge_robot_arm/cloud/api/model_control.py \
            tests/test_phase12_4_security_remediation.py \
            tests/test_phase10_2b_dashboard_backend.py
          python -m ruff format \
            src/cloud_edge_robot_arm/edge/runtime/task_executor.py \
            src/cloud_edge_robot_arm/dashboard/security.py \
            src/cloud_edge_robot_arm/cloud/api/model_control.py \
            tests/test_phase12_4_security_remediation.py \
            tests/test_phase10_2b_dashboard_backend.py

      - name: Run remediation regressions
        run: |
          mkdir -p artifacts/phase12_4_diagnostics
          set +e
          status=0
          for test_file in \
            tests/test_phase12_4_security_remediation.py \
            tests/test_phase2_task_runtime.py \
            tests/test_phase10_2b_dashboard_backend.py \
            tests/test_phase11_simulation_workbench_backend.py \
            tests/test_phase11_2_model_control_backend.py
          do
            log="artifacts/phase12_4_diagnostics/$(basename "$test_file").log"
            python -m pytest -q --tb=short "$test_file" >"$log" 2>&1
            code=$?
            cat "$log"
            if [ "$code" -ne 0 ]; then
              status=1
            fi
          done
          echo "$status" > artifacts/phase12_4_diagnostics/status.txt
          exit "$status"

      - name: Upload remediation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-4-remediation-diagnostics
          path: artifacts/phase12_4_diagnostics
          if-no-files-found: error

      - name: Remove temporary remediation machinery
        run: |
          git rm \
            .github/workflows/phase12_4_remediation.yml \
            .github/workflows/phase12_4_pr_remediation.yml \
            scripts/apply_phase12_4_remediation.py

      - name: Run project CI profile
        run: python scripts/verify_project.py --profile ci

      - name: Upload project CI summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-4-project-ci-summary
          path: artifacts/project_verification/ci_summary.json
          if-no-files-found: error

      - name: Commit verified remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden trusted time and console authorization"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
